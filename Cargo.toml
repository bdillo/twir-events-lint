[package]
name = "twir-events-lint"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.38"
chrono-tz = "0.10.4"
clap = { version = "4.5.20", features = ["derive"] }
icalendar = { version = "0.17.13", default-features = false, features = ["parser"] }
jsonwebtoken = "9.3.1"
log = "0.4.22"
nom = "8.0.0"
reqwest = { version = "0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
simple_logger = { version = "5.0.0", features = ["stderr"] }
url = "2.5.3"
